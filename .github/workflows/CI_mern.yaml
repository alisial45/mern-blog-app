name: CI MERN

on:
  push:
    branches:
      - devops
    paths-ignore:
      - 'mychart/**'
      - 'kubernetes/**'
      - 'README.md'

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install dependencies
      run: |
        cd backend && npm install
        cd ../frontend && npm install

    - name: Run build
      run: |
        cd backend && npm run build
        cd ../frontend && npm run build

    - name: Run tests
      run: |
        cd backend && npm test
        cd ../frontend && npm test

  code-quality:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Run ESLint
      run: |
        cd backend && npx eslint .
        cd ../frontend && npx eslint .

  push:
    runs-on: ubuntu-latest

    needs: build

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Backend Image
      uses: docker/build-push-action@v6
      with:
        context: ./backend
        file: ./backend/Dockerfile
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/blog-app-backend:${{github.run_id}}

    - name: Build and Push Frontend Image
      uses: docker/build-push-action@v6
      with:
        context: ./frontend
        file: ./frontend/Dockerfile
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/blog-app-frontend:${{github.run_id}}

  update-newtag-in-helm-chart:
    runs-on: ubuntu-latest

    needs: push

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.TOKEN }}

    - name: Update tag in Helm chart
      run: |
        
        sed -i 's|\(backend:.*\n.*tag:\) .*|\1 "${{github.run_id}}"|' mychart/values.yaml
        sed -i 's|\(frontend:.*\n.*tag:\) .*|\1 "${{github.run_id}}"|' mychart/values.yaml

    - name: Commit and push changes
      run: |
        git config --global user.email "sialmusharraf@gmail.com"
        git config --global user.name "alisial45"
        git add mychart/values.yaml
        git commit -m "Update tag in Helm chart"
        git push
